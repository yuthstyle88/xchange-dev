[workspace]
members = ["crates/*"]

[workspace.dependencies]
pos-error = { git = "https://github.com/108-Plaza/108-platform-services", rev = "8b53cee9a8cb8cb335b01b4afbc1f34b1c31dac1" }
pos-infra = { git = "https://github.com/108-Plaza/108-platform-services", rev = "8b53cee9a8cb8cb335b01b4afbc1f34b1c31dac1" }
pos-printer = { git = "https://github.com/108-Plaza/108-platform-services", rev = "8b53cee9a8cb8cb335b01b4afbc1f34b1c31dac1" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xc-kernel = { path = "crates/xc-kernel" }
xc-exchange = { path = "crates/xc-exchange" }
xc-shift = { path = "crates/xc-shift" }
xc-rate = { path = "crates/xc-rate" }
xc-kiosk = { path = "crates/xc-kiosk" }
xc-auth = { path = "crates/xc-auth" }
xc-approval = { path = "crates/xc-approval" }
xc-customer = { path = "crates/xc-customer" }
xc-referral = { path = "crates/xc-referral" }
xc-outbox = { path = "crates/xc-outbox" }
xc-notify = { path = "crates/xc-notify" }
xc-cash = { path = "crates/xc-cash" }
xc-queue = { path = "crates/xc-queue" }
xc-alert = { path = "crates/xc-alert" }

[package]
name = "xchange"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["108Heros Engineering"]
description = "XCHANGE server"
license = "Proprietary"
publish = false

[dependencies]
pos-error = { workspace = true }
pos-infra = { workspace = true, features = ["config", "telemetry"] }
pos-printer = { workspace = true }
xc-kernel = { workspace = true }
xc-exchange = { workspace = true }
xc-shift = { workspace = true }
xc-rate = { workspace = true }
xc-kiosk = { workspace = true }
xc-auth = { workspace = true }
xc-approval = { workspace = true }
xc-customer = { workspace = true }
xc-referral = { workspace = true }
xc-outbox = { workspace = true }
xc-notify = { workspace = true }
xc-cash = { workspace = true }
xc-queue = { workspace = true }
xc-alert = { workspace = true }
subtle = "2"
xc-app = { path = "crates/xc-app" }
xc-marketing = { path = "crates/xc-marketing" }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
actix-web = "4"
anyhow = "1"
async-trait = "0.1"
config = { version = "0.15", default-features = false, features = ["yaml"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
rust-embed = "=8.13.0"
ts-rs = "=12.0.1"

[dev-dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "test-util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xchange"
path = "src/main.rs"

[profile.dev.package.argon2]
opt-level = 3


