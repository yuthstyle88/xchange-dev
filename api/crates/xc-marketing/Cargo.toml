[package]
# One test binary per package: tests/all.rs (api/scripts/gen-test-binaries.py).
autotests = false
name = "xc-marketing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["108Heros Engineering"]
description = "Marketing bounded context for xchange: campaigns, benefit rules, coupons, budgets, segments (design marketing-campaigns.md, #560)"
license = "Proprietary"
publish = false

[dependencies]
thiserror = { workspace = true }
rust_decimal = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "rust_decimal", "migrate", "json"] }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
xc-kernel = { workspace = true }
xc-approval = { workspace = true }
xc-auth = { workspace = true }
pos-error = { workspace = true }

[dev-dependencies]
xc-testdb = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
xc-testlist = { path = "../xc-testlist" }

[[test]]
name = "all"
path = "tests/all.rs"
