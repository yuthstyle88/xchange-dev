[package]
name = "xc-customer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["108Heros Engineering"]
description = "Customer identity and consent bounded context for xchange"
license = "Proprietary"
publish = false

[dependencies]
pos-error = { workspace = true }
pos-infra = { workspace = true }
xc-kernel = { workspace = true }
xc-auth = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
