[package]
name = "xc-referral"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["108Heros Engineering"]
description = "v3's half of the Broker seam: the exchange feed and attribution capture (design broker-seam.md)"
license = "Proprietary"
publish = false

[dependencies]
pos-error = { workspace = true }
xc-outbox = { path = "../xc-outbox" }
xc-approval = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
rust_decimal = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono"] }
xc-kernel = { workspace = true }
xc-customer = { workspace = true }

[dev-dependencies]
# BK-10 #1412 up-front tests: seal PHONE identities and install the PII key the member keys open.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = "0.1"
