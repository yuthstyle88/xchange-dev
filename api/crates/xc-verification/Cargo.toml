[package]
name = "xc-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["108Heros Engineering"]
description = "Verification bounded context for xchange: cases a reviewer decides, documents in DocumentStore (design verification.md)"
license = "Proprietary"
publish = false

[dependencies]
pos-error = { workspace = true }
xc-kernel = { workspace = true }
xc-customer = { workspace = true }
xc-approval = { workspace = true }
xc-auth = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json"] }
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
