[package]
name = "xc-booking"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["108Heros Engineering"]
description = "Booking bounded context for xchange: time slots with atomic capacity (design booking-slots.md)"
license = "Proprietary"
publish = false

[dependencies]
pos-error = { workspace = true }
xc-kernel = { workspace = true }
xc-customer = { workspace = true }
xc-rate = { workspace = true }
xc-referral = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json"] }
tracing = "0.1"

[dev-dependencies]
chrono-tz = { version = "0.10" }
pos-infra = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
xc-approval = { workspace = true }
