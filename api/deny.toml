# cargo-deny configuration — supply-chain checks for the xchange workspace.
# Run: cargo deny check

[advisories]
version = 2
# RustSec advisory database. Each ignore needs a rationale.
ignore = [
    # proc-macro-error2 is unmaintained (no vuln, no drop-in replacement); both it
    # and the original proc-macro-error are unmaintained. Pulled transitively via
    # validator_derive 0.20.
    "RUSTSEC-2026-0173",
    # Marvin Attack (timing sidechannel in pure-Rust `rsa`, no fix). Pulled via
    # jsonwebtoken's rust_crypto provider.
    "RUSTSEC-2023-0071",
    # Invalid pointer deref in crossbeam's `fmt::Pointer` impl for Atomic/Shared.
    "RUSTSEC-2026-0204",
    # rustybuzz and ttf-parser are UNMAINTAINED.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
    # h2 0.3.27 queues empty DATA frames without limit.
    "RUSTSEC-2026-0258",
]

[licenses]
version = 2
# First-party crates are `license = "Proprietary"` + `publish = false`,
# so `private.ignore` skips them; third-party licenses must be on the allow list.
private = { ignore = true }
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "0BSD", "ISC", "Zlib", "MPL-2.0",
    "OpenSSL", "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

# 108 standard: sqlx pinned to 0.9 everywhere. Fail CI if an older major sneaks in.
[[bans.deny]]
name = "sqlx"
version = "<0.9"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/108-Plaza/108-platform-services",
]
