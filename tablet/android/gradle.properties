# The one origin the wrapper loads and allows (W-D5, W-D6), built into the APK as BuildConfig.XC_ORIGIN.
# `https://host` or `https://host:port`, no path and no trailing slash. Override per build with -Pxc.origin=...
# Default: the xchange v3 server (deploy/HOST-do-sgp1.md:30).
xc.origin=https://xc-v3.spacing.cloud
