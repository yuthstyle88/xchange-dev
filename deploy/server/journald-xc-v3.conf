# /etc/systemd/journald.conf.d/xc-v3.conf example.
# Log retention for the v3 server host (docs/design/xchange-v3.md §7b).
# Note: systemd-journald settings are host-wide and applied by the host's owner.
# The numbers below are a proposal the owner has not ruled on.

[Journal]
SystemMaxUse=1G
MaxRetentionSec=30day
