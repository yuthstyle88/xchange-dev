server {
    listen 80;
    listen [::]:80;
    server_name xc-customer.spacing.cloud;

    client_max_body_size 64k;

    root /var/www/xc-customer/web;
    index index.html;

    # Kiosk API proxy: POST only to backend upstream
    location = /api/kiosk {
        if ($request_method != POST) {
            return 405;
        }

        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8093/api/kiosk;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Entry points, loaders, and version manifests must not be cached
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # All other paths serve static assets or fall back to /index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
