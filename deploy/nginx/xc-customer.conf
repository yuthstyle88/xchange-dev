server {
    listen 80;
    listen [::]:80;
    # nginx on the live host takes "listen 443 ssl http2;". nginx >= 1.25.1 prefers "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xc-customer.spacing.cloud;

    include snippets/acme-challenge.conf;
    include snippets/ssl-params.conf;

    ssl_certificate /etc/letsencrypt/live/xc-customer.spacing.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xc-customer.spacing.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    root /var/www/xc-customer/web;
    index index.html;

    # Kiosk API proxy: POST only to backend upstream
    location = /api/kiosk {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }
        if ($request_method != POST) {
            return 405;
        }

        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8093/api/kiosk;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Entry points, loaders, and version manifests must not be cached.
    # Locations with their own add_header do not inherit server-level add_header,
    # so Strict-Transport-Security must be repeated here.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # All other paths serve static assets or fall back to /index.html (SPA)
    location / {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
