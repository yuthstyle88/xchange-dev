name: xchange_kiosk
description: "XCHANGE customer kiosk — the four customer-facing screens, as Flutter web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  dio: ^5.7.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/kiosk.json
    - assets/img/logo.png
    - assets/img/telegram_qr.png

  fonts:
    # The Flutter web engine requests Roboto before the first frame.
    # Where a firewall drops packets instead of refusing them, the page stays white ~10s.
    # Aliasing Roboto to the already-bundled NotoSans.ttf satisfies the engine locally with 0 bytes growth.
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao.ttf
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
