name: xchange_kiosk
description: "XCHANGE customer kiosk — the four customer-facing screens, as Flutter web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  dio: ^5.7.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/kiosk.json
    - assets/img/logo.png
    - assets/img/telegram_qr.png
