name: counter-app

# XC Counter (docs/design/xc-counter-app.md). Not a required check. macOS only: the app links
# WKWebView, the Keychain and ImageCaptureCore.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'counter-app/**'
      - 'api/crates/xc-device-agent/**'
      - '.github/workflows/counter-app.yml'

# Merge-turn gate (ci:go): owner 2026-11-21 "ปรับการรัน ci เฉพาะ merge เข้า main พอ" ("เพราะมันรันมากไป").
# A PR in 108-Plaza/xchange WITHOUT the `ci:go` label gets its own `pr-wait-<number>` concurrency group
# (cancel-in-progress) and every heavy job FAILS at its first step "Wait for merge turn (ci:go)"
# in seconds -- it fails rather than skips, because a skipped required check counts as passing.
# A PR WITH `ci:go` runs the full CI in the shared `pr` group, never cancelled. Push to main,
# workflow_dispatch and schedules are unchanged. The repository check keeps mirrors/forks (whose
# authors cannot add labels) on full CI. Merge turn: (1) add `ci:go` to ONE PR; (2) `gh pr
# update-branch` or close+reopen (a re-run does not see a label added later); (3) merge;
# (4) on FAIL remove `ci:go`.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') && format('counter-app-pr-wait-{0}', github.event.pull_request.number) || 'counter-app-pr') || format('counter-app-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SHARED_CRATES_TOKEN }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  macos:
    name: macos
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: counter-app/src-tauri
    steps:
      - name: Wait for merge turn (ci:go)
        if: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}
        run: |
          echo "::error::Not this PR's merge turn yet - add the ci:go label, then update-branch (or close+reopen) to run CI"
          exit 1

      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        working-directory: .
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up toolchain
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
