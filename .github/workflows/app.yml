name: app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('app-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'app-main') || format('app-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

jobs:
  # A light job decides whether the app needs building (same should-build.sh as before), so a PR
  # that does not touch app/ or the shared CI files (for example a docs-only PR) runs no Flutter
  # job at all (owner 2026-10-09). The heavy `app` job is skipped at job level; a skipped job
  # reports success for the required `app` check. A cancelled run reports `app` as cancelled, not
  # skipped/green (measured: 108-Plaza/note-front-end-main run 37405196163, changes=cancelled
  # test=cancelled). A FAILED `changes` job leaves skip_build empty => the full app job runs.
  changes:
    name: changes
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    outputs:
      skip_build: ${{ steps.filter.outputs.skip_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test main-push-base
        run: bash .github/scripts/main-push-base.test.sh

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="${PR_BASE_REF:-${GITHUB_BASE_REF:-main}}"
            if [ -n "$base_ref" ] && git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "origin/$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            elif [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            else
              BASE="$PR_BASE"
            fi
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            BASE=$(bash .github/scripts/main-push-base.sh app "$PUSH_AFTER" 2>/dev/null || true)
            HEAD="$PUSH_AFTER"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ -z "$BASE" ]; then
            echo "No successful ancestor run on main found — running full build."
            skip_build=false
          else
            should_build=$(bash .github/scripts/should-build.sh app .github/workflows/app.yml "$EVENT_NAME" "$BASE" "$HEAD")
            echo "should_build=$should_build"
            if [ "$should_build" = "false" ]; then
              skip_build=true
            else
              skip_build=false
            fi
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

  app:
    name: app
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip_build != 'true' }}
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 20
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter (use runner SDK)
        run: |
          FLUTTER_ROOT="${FLUTTER_ROOT:-}"
          if [ -z "$FLUTTER_ROOT" ]; then
            for d in "$HOME/develop/flutter" "/Users/yuth/develop/flutter"; do
              if [ -x "$d/bin/flutter" ]; then
                FLUTTER_ROOT="$d"
                break
              fi
            done
          fi
          if [ -z "$FLUTTER_ROOT" ] || [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            echo "Flutter not found at $FLUTTER_ROOT/bin — set FLUTTER_ROOT on the runner." >&2
            exit 1
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter 3.44.0
        run: |
          flutter --version
          VERSION=$(flutter --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^Flutter 3\.44\.0(\s|$)'; then
            echo "::error::Flutter version must be 3.44.0, but runner has: $VERSION"
            exit 1
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Check formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        if: github.event_name != 'pull_request'   # owner 2026-10-17: tests run only on the merge into main
        working-directory: app
        run: flutter test

      - name: Build web
        working-directory: app
        run: flutter build web --release
