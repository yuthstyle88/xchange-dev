name: app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('app-pr-{0}', github.event.pull_request.number) || format('app-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          should_build=$(bash .github/scripts/should-build.sh app .github/workflows/app.yml "$EVENT_NAME" "$BASE" "$HEAD")
          echo "should_build=$should_build"
          if [ "$should_build" = "false" ]; then
            skip_build=true
          else
            skip_build=false
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (use runner SDK)
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        run: |
          FLUTTER_ROOT="${FLUTTER_ROOT:-}"
          if [ -z "$FLUTTER_ROOT" ]; then
            for d in "$HOME/develop/flutter" "/Users/yuth/develop/flutter"; do
              if [ -x "$d/bin/flutter" ]; then
                FLUTTER_ROOT="$d"
                break
              fi
            done
          fi
          if [ -z "$FLUTTER_ROOT" ] || [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            echo "Flutter not found at $FLUTTER_ROOT/bin — set FLUTTER_ROOT on the runner." >&2
            exit 1
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter 3.44.0
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        run: |
          flutter --version
          VERSION=$(flutter --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^Flutter 3\.44\.0(\s|$)'; then
            echo "::error::Flutter version must be 3.44.0, but runner has: $VERSION"
            exit 1
          fi

      - name: Install dependencies
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter pub get

      - name: Check formatting
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter analyze

      - name: Test
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter test

      - name: Build web
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter build web --release
