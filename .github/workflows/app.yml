name: app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('app-pr-{0}', github.event.pull_request.number) || format('app-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        run: |
          skip_build=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            pr_files=$(git diff --no-renames --name-only "$base_sha...$head_sha")
            echo "PR changed files:"
            echo "$pr_files"

            if [ -z "$pr_files" ]; then
              echo "Empty diff — running build."
            elif echo "$pr_files" | grep -qE '^app/'; then
              echo "Changes detected in app/ — running build."
            elif ! echo "$pr_files" | grep -vqE '^docs/|\.md$'; then
              echo "PR only touches docs — skipping build."
              skip_build=true
            elif echo "$pr_files" | grep -qE '^\.github/workflows/app\.yml'; then
              head_files=$(git diff --no-renames --name-only "${head_sha}^...${head_sha}" 2>/dev/null || echo "$pr_files")
              echo "HEAD commit changed files:"
              echo "$head_files"
              if [ -n "$head_files" ] && ! echo "$head_files" | grep -vqE '^docs/|\.md$'; then
                echo "HEAD commit is doc-only test commit — skipping build."
                skip_build=true
              else
                echo "Workflow changed in HEAD — running build."
              fi
            else
              echo "No changes under app/ — skipping build."
              skip_build=true
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              push_files=$(git diff --no-renames --name-only "${{ github.event.before }}...${{ github.event.after }}")
              echo "Push changed files:"
              echo "$push_files"
              if [ -n "$push_files" ] && ! echo "$push_files" | grep -qE '^(app/|\.github/workflows/app\.yml)'; then
                echo "Push has no changes under app/ or app.yml — skipping build."
                skip_build=true
              fi
            fi
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (use runner SDK)
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        run: |
          FLUTTER_ROOT="${FLUTTER_ROOT:-}"
          if [ -z "$FLUTTER_ROOT" ]; then
            for d in "$HOME/develop/flutter" "/Users/yuth/develop/flutter"; do
              if [ -x "$d/bin/flutter" ]; then
                FLUTTER_ROOT="$d"
                break
              fi
            done
          fi
          if [ -z "$FLUTTER_ROOT" ] || [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            echo "Flutter not found at $FLUTTER_ROOT/bin — set FLUTTER_ROOT on the runner." >&2
            exit 1
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter 3.44.0
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        run: |
          flutter --version
          VERSION=$(flutter --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^Flutter 3\.44\.0(\s|$)'; then
            echo "::error::Flutter version must be 3.44.0, but runner has: $VERSION"
            exit 1
          fi

      - name: Install dependencies
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter pub get

      - name: Check formatting
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter analyze

      - name: Test
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter test

      - name: Build web
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: app
        run: flutter build web --release
