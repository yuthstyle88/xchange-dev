# Android build and unit tests for the branch tablet wrapper (kiosk-shared-phone §7.11, TW-3).
# Release signing on workflow_dispatch uses ALL FOUR repository secrets (set all four or none):
#   XCHANGE_ANDROID_KEYSTORE_BASE64   the .jks keystore, base64
#   XCHANGE_ANDROID_KEYSTORE_PASSWORD
#   XCHANGE_ANDROID_KEY_ALIAS
#   XCHANGE_ANDROID_KEY_PASSWORD

name: tablet-android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tablet/**'
      - '.github/workflows/tablet-android.yml'

# Merge-turn gate (ci:go): owner 2026-11-21 "ปรับการรัน ci เฉพาะ merge เข้า main พอ" ("เพราะมันรันมากไป").
# A PR in 108-Plaza/xchange WITHOUT the `ci:go` label gets its own `pr-wait-<number>` concurrency group
# (cancel-in-progress) and every heavy job FAILS at its first step "Wait for merge turn (ci:go)"
# in seconds -- it fails rather than skips, because a skipped required check counts as passing.
# A PR WITH `ci:go` runs the full CI in the shared `pr` group, never cancelled. Push to main,
# workflow_dispatch and schedules are unchanged. The repository check keeps mirrors/forks (whose
# authors cannot add labels) on full CI. Merge turn: (1) add `ci:go` to ONE PR; (2) `gh pr
# update-branch` or close+reopen (a re-run does not see a label added later); (3) merge;
# (4) on FAIL remove `ci:go`.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') && format('tablet-android-pr-wait-{0}', github.event.pull_request.number) || 'tablet-android-pr') || format('tablet-android-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}

permissions:
  contents: read

jobs:
  tablet-android:
    name: tablet-android
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 30
    steps:
      - name: Wait for merge turn (ci:go)
        if: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/xchange' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}
        run: |
          echo "::error::Not this PR's merge turn yet - add the ci:go label, then update-branch (or close+reopen) to run CI"
          exit 1

      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK
        run: |
          set -eu
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Library/Android/sdk" "/Users/yuth/Library/Android/sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate/platform-tools" ]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "Android SDK: $candidate"
              exit 0
            fi
          done
          echo "::error::No Android SDK found on runner ${RUNNER_NAME} — need a directory containing platform-tools. Searched: ANDROID_HOME=${ANDROID_HOME:-<unset>}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}, $HOME/Library/Android/sdk, /Users/yuth/Library/Android/sdk"
          exit 1

      - name: Test and assemble debug APK
        working-directory: tablet/android
        run: ./gradlew test :app:assembleDebug

      - name: Release signing (all four secrets or none)
        id: signing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.XCHANGE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XCHANGE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XCHANGE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XCHANGE_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing XCHANGE_ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing XCHANGE_ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing XCHANGE_ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing XCHANGE_ANDROID_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "No signing secrets set — building debug-signed."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Signing secrets are set only in part — missing:$missing. Set all four or none; no silent fallback to debug signing." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/xchange-tablet-release.jks"
          printf '%s\n' "$KEYSTORE_BASE64" | openssl base64 -d -out "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::XCHANGE_ANDROID_KEYSTORE_BASE64 did not decode to a non-empty keystore." >&2
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > tablet/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: tablet/android
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: xchange-tablet-apk
          path: tablet/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/xchange-tablet-release.jks"
          rm -f tablet/android/key.properties
