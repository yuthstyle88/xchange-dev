name: web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'web-main') || format('web-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

jobs:
  # A PR that only touches docs/** or *.md builds nothing (owner 2026-10-09; pilot
  # 108-Plaza/rust-project-backend#700). The heavy jobs below are skipped by their job-level `if:`;
  # a skipped job reports success to branch protection. A cancelled run reports them as cancelled,
  # not skipped/green (measured: 108-Plaza/note-front-end-main run 37405196163,
  # changes=cancelled test=cancelled). A push to main is judged the same way on before..after, so a
  # merged doc PR does not build either. Anything else, an empty diff, a new branch or a push whose
  # `before` the runner cannot resolve, a manual run, or a FAILED `changes` job => full CI.
  changes:
    name: changes
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test main-push-base
        run: bash .github/scripts/main-push-base.test.sh
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docs_only=false
          files=
          # --no-renames: a rename lists only its new path, so moving code into docs/ would
          # read as docs-only and skip the build that just lost a file.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="${PR_BASE_REF:-${GITHUB_BASE_REF:-main}}"
            if [ -n "$base_ref" ] && git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "origin/$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            elif [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            else
              BASE="$PR_BASE"
            fi
            files=$(git diff --no-renames --name-only "$BASE...$PR_HEAD")
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF" = "refs/heads/main" ]; then
              before=$(bash .github/scripts/main-push-base.sh web "$PUSH_AFTER" 2>/dev/null || true)
            else
              before="$PUSH_BEFORE"
            fi
            # A new branch has before=000…0; a force-push can leave `before` unreachable. Both => full CI.
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              files=$(git diff --no-renames --name-only "$before" "$PUSH_AFTER")
            fi
          fi
          if [ -n "$files" ]; then
            echo "changed files:"; echo "$files"
            if ! echo "$files" | grep -vqE '^docs/|\.md$'; then
              docs_only=true
              # A doc the build or a test reads is not a doc (pos108-core#2524 review): e.g.
              # include_str!("../docs/x.md") in a guard test. Any such reader of a changed file
              # => full CI. Over-matching only costs a full build; comments that merely mention
              # a doc do not match (the reader call must be on the same line).
              for f in $files; do
                b=$(basename "$f" | sed 's/[][\.*^$()+?{}|]/\\&/g')
                if git grep -qE "(include_(str|bytes)!|read_to_string|fs::read|readFileSync|readFile|File\(|open\().*${b}|${b}\?raw" \
                    -- '*.rs' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.py' '*.sh' '*.dart'; then
                  echo "read by the build or a test: $f"; docs_only=false; break
                fi
              done
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  web:
    name: web
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Node only, so the idle macOS pool, not the saturated Linux pool (#611; owner 2026-10-09).
    runs-on: [self-hosted, macOS, ARM64]
    # stopgap: the full suite runs ~8 min on the shared macOS pool; root cause #3237. Back to 10 when #3237 lands.
    timeout-minutes: 20
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (npm ci)
        timeout-minutes: 5
        run: |
          date -u
          npm config get registry
          node -v
          npm -v
          npm --prefix web ci --no-audit --no-fund --prefer-offline
          date -u

      - name: Typecheck
        timeout-minutes: 5
        run: |
          run_with_stall_capture() {
            "$@" &
            local pid=$!
            local elapsed=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 1
              kill -0 "$pid" 2>/dev/null || break
              elapsed=$((elapsed + 1))
              if [ "$elapsed" -ge 120 ] && [ $((elapsed % 30)) -eq 0 ]; then
                echo "=== stall capture at ${elapsed}s ($(date -u)) ==="
                # shellcheck disable=SC2009
                ps -axo pid,ppid,stat,pcpu,etime,wchan,command | grep -E 'tsc|vitest|node' | grep -v grep || true
                if [ "$elapsed" -eq 120 ]; then
                  log show --last 5m --style compact --predicate 'process == "syspolicyd" || process == "tccd" || process == "amfid"' | tail -50 || true
                fi
              fi
            done
            wait "$pid"
          }
          date -u
          run_with_stall_capture npm --prefix web run typecheck
          date -u

      - name: Test
        # owner 2026-10-17: tests run only on the merge into main; a PR still typechecks and builds
        if: github.event_name != 'pull_request'
        timeout-minutes: 8
        run: |
          run_with_stall_capture() {
            "$@" &
            local pid=$!
            local elapsed=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 1
              kill -0 "$pid" 2>/dev/null || break
              elapsed=$((elapsed + 1))
              if [ "$elapsed" -ge 120 ] && [ $((elapsed % 30)) -eq 0 ]; then
                echo "=== stall capture at ${elapsed}s ($(date -u)) ==="
                # shellcheck disable=SC2009
                ps -axo pid,ppid,stat,pcpu,etime,wchan,command | grep -E 'tsc|vitest|node' | grep -v grep || true
                if [ "$elapsed" -eq 120 ]; then
                  log show --last 5m --style compact --predicate 'process == "syspolicyd" || process == "tccd" || process == "amfid"' | tail -50 || true
                fi
              fi
            done
            wait "$pid"
          }
          date -u
          run_with_stall_capture npx --prefix web vitest run --root web --reporter=verbose --teardownTimeout=10000 < /dev/null
          date -u

      - name: Build
        timeout-minutes: 5
        run: |
          date -u
          npm --prefix web run build
          date -u
