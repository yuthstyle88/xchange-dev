name: api

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('api-pr-{0}', github.event.pull_request.number) || format('api-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xchange_test
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "psql -h 127.0.0.1 -U postgres -d xchange_test -tAc 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SHARED_CRATES_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test should-build
        run: bash .github/scripts/should-build.test.sh

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          should_build=$(bash .github/scripts/should-build.sh api .github/workflows/api.yml "$EVENT_NAME" "$BASE" "$HEAD")
          echo "should_build=$should_build"
          if [ "$should_build" = "false" ]; then
            skip_build=true
          else
            skip_build=false
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

      - name: Verify rustc 1.98.1
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: api
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup show active-toolchain || true
          rustc --version
          VERSION=$(rustc --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^rustc 1\.98\.1(\s|$)'; then
            echo "::error::rustc version must be 1.98.1, but found: $VERSION"
            exit 1
          fi

      - name: Check formatting
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: api
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: api
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/xchange_test
        run: cargo test --workspace --no-fail-fast

      - name: Dependency policy
        if: ${{ steps.filter.outputs.skip_build != 'true' }}
        working-directory: api
        run: |
          VERSION="0.19.9"
          if ! cargo deny --version 2>/dev/null | grep -qF "$VERSION"; then
            cargo install --locked cargo-deny --version "$VERSION"
          fi
          cargo deny check
