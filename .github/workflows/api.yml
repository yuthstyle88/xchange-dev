name: api

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('api-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'api-main') || format('api-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  # A light job decides whether the api needs building, so a PR that does not touch api/, web/
  # or the shared CI files (for example a docs-only PR) never waits for a Linux runner and never
  # starts the postgres service (owner 2026-10-09; doc PR 565 waited 5 min for a Dell runner and
  # started postgres only to skip every step). The decision is the same should-build.sh as before.
  # The heavy `api` job is skipped at job level; a skipped job reports success for the required
  # `api` check. A cancelled run reports `api` as cancelled, not skipped/green (measured:
  # 108-Plaza/note-front-end-main run 37405196163, changes=cancelled test=cancelled).
  # A FAILED `changes` job leaves skip_build empty => the full api job runs.
  changes:
    name: changes
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    outputs:
      skip_build: ${{ steps.filter.outputs.skip_build }}
      test_args: ${{ steps.filter.outputs.test_args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test should-build
        run: bash .github/scripts/should-build.test.sh

      - name: Self-test api-test-plan
        run: bash .github/scripts/api-test-plan.test.sh

      - name: Self-test main-push-base
        run: bash .github/scripts/main-push-base.test.sh

      - name: Self-test migration-order
        run: bash .github/scripts/migration-order.test.sh

      - name: Self-test migration-slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="${PR_BASE_REF:-${GITHUB_BASE_REF:-main}}"
            if [ -n "$base_ref" ] && git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "origin/$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            elif [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            else
              BASE="$PR_BASE"
            fi
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            BASE=$(bash .github/scripts/main-push-base.sh api "$PUSH_AFTER" 2>/dev/null || true)
            HEAD="$PUSH_AFTER"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            if ! git diff --name-only "$BASE" "$HEAD" -- 'scripts/migration-slot*' '.github/scripts/migration-order*' 2>/dev/null | grep -q .; then
              echo "migration-slot: no changes to migration-slot or migration-order; skipping self-test"
              exit 0
            fi
          fi
          bash scripts/migration-slot.test.sh

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="${PR_BASE_REF:-${GITHUB_BASE_REF:-main}}"
            if [ -n "$base_ref" ] && git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "origin/$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            elif [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              BASE=$(git merge-base "$base_ref" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            else
              BASE="$PR_BASE"
            fi
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            BASE=$(bash .github/scripts/main-push-base.sh api "$PUSH_AFTER" 2>/dev/null || true)
            HEAD="$PUSH_AFTER"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ -z "$BASE" ]; then
            echo "No successful ancestor run on main found — running full build."
            skip_build=false
          else
            should_build_api=$(bash .github/scripts/should-build.sh api .github/workflows/api.yml "$EVENT_NAME" "$BASE" "$HEAD")
            should_build_web=$(bash .github/scripts/should-build.sh --pathspec "web/pages/ web/vite.config.ts web/package.json web/package-lock.json api/web/forms/ web/src/shared/api/generated/" .github/workflows/api.yml "$EVENT_NAME" "$BASE" "$HEAD")
            echo "should_build_api=$should_build_api should_build_web=$should_build_web"
            if [ "$should_build_api" = "true" ] || [ "$should_build_web" = "true" ]; then
              skip_build=false
            else
              skip_build=true
            fi
          fi
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -d "$HOME/.cargo/bin" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            CHANGED_FILE=$(mktemp)
            METADATA_FILE=$(mktemp)
            if git diff --name-only "$BASE...$HEAD" > "$CHANGED_FILE" 2>/dev/null && \
               cargo metadata --format-version 1 --no-deps --manifest-path api/Cargo.toml > "$METADATA_FILE" 2>/dev/null; then
              test_args=$(bash .github/scripts/api-test-plan.sh "$CHANGED_FILE" "$METADATA_FILE" 2>/dev/null || echo "--workspace")
            else
              test_args="--workspace"
            fi
            rm -f "$CHANGED_FILE" "$METADATA_FILE"
          else
            test_args="--workspace"
          fi
          test_args="${test_args:-}"
          echo "test_args=$test_args" >> "$GITHUB_OUTPUT"
          echo "skip_build=$skip_build test_args=$test_args"

  test:
    name: test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 12
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SHARED_CRATES_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - name: Refuse to report green when changes did not succeed
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "changes did not succeed: ${{ needs.changes.result }}"
          exit 1

      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration order
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/migration-order.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

      - name: Self-test should-build
        run: bash .github/scripts/should-build.test.sh

      - name: Self-test api-test-plan
        run: bash .github/scripts/api-test-plan.test.sh

      - name: Start postgres (per run)
        env:
          LC_ALL: C
        run: |
          # Postgres >= 16 on the host (macOS Homebrew or Linux).
          PGBIN=
          for v in 17 16; do
            if [ -x "/opt/homebrew/opt/postgresql@$v/bin/pg_ctl" ]; then PGBIN="/opt/homebrew/opt/postgresql@$v/bin"; break; fi
            if [ -x "/usr/lib/postgresql/$v/bin/pg_ctl" ]; then PGBIN="/usr/lib/postgresql/$v/bin"; break; fi
          done
          if [ -z "$PGBIN" ] && command -v pg_ctl >/dev/null; then
            major=$(pg_ctl --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')
            if [ "$major" -ge 16 ]; then PGBIN=$(dirname "$(command -v pg_ctl)"); fi
          fi

          PGPORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')

          if [ -n "$PGBIN" ]; then
            # Short path under /tmp: the unix socket path must stay under macOS's 104-byte limit.
            PGROOT=$(mktemp -d /tmp/xcpg.XXXXXX)
            {
              echo "XC_PGBIN=$PGBIN"
              echo "XC_PGROOT=$PGROOT"
              echo "XC_PGPORT=$PGPORT"
              echo "TEST_DATABASE_URL=postgres://postgres@127.0.0.1:$PGPORT/xchange_test"
            } >> "$GITHUB_ENV"
            # --locale=C: byte-order collation, the same as the musl-based postgres:16-alpine image.
            "$PGBIN/initdb" -D "$PGROOT/data" -U postgres --auth=trust --encoding=UTF8 --locale=C >/dev/null
            "$PGBIN/pg_ctl" -D "$PGROOT/data" -l "$PGROOT/log" -w -t 60 start \
              -o "-p $PGPORT -k $PGROOT -c listen_addresses=127.0.0.1 -c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_locks_per_transaction=512"
            "$PGBIN/createdb" -h 127.0.0.1 -p "$PGPORT" -U postgres xchange_test
            "$PGBIN/psql" -h 127.0.0.1 -p "$PGPORT" -U postgres -d xchange_test -tAc 'SELECT version()'
          else
            # Fallback when runner has no postgres >= 16: start docker postgres:17
            CONTAINER_NAME="xcpg-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
            {
              echo "XC_CONTAINER=$CONTAINER_NAME"
              echo "XC_PGPORT=$PGPORT"
              echo "TEST_DATABASE_URL=postgres://postgres@127.0.0.1:$PGPORT/xchange_test"
            } >> "$GITHUB_ENV"
            echo "no postgres >= 16 on runner $RUNNER_NAME; starting docker postgres:17 (container: $CONTAINER_NAME) on port $PGPORT"
            docker run --rm -d \
              --name "$CONTAINER_NAME" \
              -p "127.0.0.1:$PGPORT:5432" \
              -e POSTGRES_PASSWORD=pg \
              -e POSTGRES_HOST_AUTH_METHOD=trust \
              -e POSTGRES_DB=xchange_test \
              postgres:17

            # Find host pg_isready if available
            PG_ISREADY_BIN=
            if command -v pg_isready >/dev/null 2>&1; then
              PG_ISREADY_BIN="$(command -v pg_isready)"
            else
              for p in /opt/homebrew/opt/libpq/bin/pg_isready /opt/homebrew/bin/pg_isready /usr/lib/postgresql/*/bin/pg_isready; do
                if [ -x "$p" ]; then
                  PG_ISREADY_BIN="$p"
                  break
                fi
              done
            fi

            READY=0
            echo "Waiting for postgres to become ready on 127.0.0.1:$PGPORT..."
            for attempt in $(seq 1 60); do
              if [ -f "$HOME/.colima/_lima/colima/ssh.config" ]; then
                COLIMA_PORT=$(awk '$1 == "Port" {print $2; exit}' "$HOME/.colima/_lima/colima/ssh.config")
                if [ -n "$COLIMA_PORT" ]; then
                  ssh -F "$HOME/.colima/_lima/colima/ssh.config" -p "$COLIMA_PORT" -T -O forward -L "127.0.0.1:$PGPORT:127.0.0.1:$PGPORT" lima-colima 2>/dev/null || true
                fi
              fi
              if [ -n "$PG_ISREADY_BIN" ]; then
                if "$PG_ISREADY_BIN" -h 127.0.0.1 -p "$PGPORT" -U postgres >/dev/null 2>&1; then
                  READY=1
                  break
                fi
              elif python3 -c "import socket; s=socket.create_connection(('127.0.0.1', $PGPORT), timeout=1); s.close()" >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 1
            done

            if [ "$READY" -ne 1 ]; then
              echo "::error::Postgres container did not become ready on 127.0.0.1:$PGPORT after 60 seconds"
              exit 1
            fi

            echo "Postgres is ready on 127.0.0.1:$PGPORT"
            docker exec "$CONTAINER_NAME" psql -U postgres -d xchange_test -tAc 'SELECT version()'
          fi

      - name: Verify rustc 1.98.1
        working-directory: api
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup show active-toolchain || true
          rustc --version
          VERSION=$(rustc --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^rustc 1\.98\.1(\s|$)'; then
            echo "::error::rustc version must be 1.98.1, but found: $VERSION"
            exit 1
          fi

      - name: Check formatting
        working-directory: api
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: api
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Web screens: build"
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Install cargo-nextest
        working-directory: api
        run: |
          VERSION="0.9.137"
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-$HOME/.cache}"
          ROOT="$TOOL_CACHE/xchange-cargo-nextest-$VERSION"
          BIN="$ROOT/bin/cargo-nextest"
          if [ ! -x "$BIN" ]; then
            CARGO_TARGET_DIR="$ROOT/target" cargo install cargo-nextest --version "$VERSION" --locked --root "$ROOT"
            rm -rf "$ROOT/target"
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:${{ env.XC_PGPORT }}/xchange_test
          XC_REQUIRE_WEB_DIST: 1
          TEST_ARGS: ${{ needs.changes.outputs.test_args }}
        run: |
          if [ -z "$TEST_ARGS" ]; then
            echo "Skipping test step: test_args is empty (no Rust packages affected)"
          else
            cargo nextest run $TEST_ARGS --no-fail-fast
          fi

      # The form helper is TypeScript under api/web/forms (#378). The server embeds the built
      # api/static/xc-forms.js, so this fails when that file is not the build of its source.
      - name: Form helper typecheck and build check
        run: |
          npm --prefix api/web/forms ci --no-audit --no-fund
          npm --prefix api/web/forms run check

      - name: Form validation JS tests
        run: node --test api/tests/js/*.test.mjs

      - name: "Release check refuses no screens"
        working-directory: api
        run: cargo check --release --locked

      - name: Dependency policy
        working-directory: api
        run: |
          VERSION="0.19.9"
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-$HOME/.cache}"
          ROOT="$TOOL_CACHE/xchange-cargo-deny-$VERSION"
          BIN="$ROOT/bin/cargo-deny"
          if [ ! -x "$BIN" ] || [ "$("$BIN" --version 2>/dev/null)" != "cargo-deny $VERSION" ]; then
            CARGO_TARGET_DIR="$ROOT/target" cargo install cargo-deny --version "$VERSION" --locked --root "$ROOT"
            rm -rf "$ROOT/target"
          fi
          "$BIN" check

      - name: Stop postgres and remove its data
        if: always()
        run: |
          if [ -n "${XC_PGROOT:-}" ] && [ -d "$XC_PGROOT" ]; then
            if [ -n "${XC_PGBIN:-}" ] && [ -x "$XC_PGBIN/pg_ctl" ]; then
              "$XC_PGBIN/pg_ctl" -D "$XC_PGROOT/data" -m immediate stop || true
            fi
            rm -rf "$XC_PGROOT"
          fi
          if [ -n "${XC_CONTAINER:-}" ]; then
            echo "Stopping container $XC_CONTAINER..."
            docker stop "$XC_CONTAINER" || true
          fi

  device-agent-linux:
    name: device-agent-linux
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 12
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SHARED_CRATES_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - name: Refuse to report green when changes did not succeed
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "changes did not succeed: ${{ needs.changes.result }}"
          exit 1

      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify rustc 1.98.1
        working-directory: api
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup show active-toolchain || true
          rustc --version
          VERSION=$(rustc --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^rustc 1\.98\.1(\s|$)'; then
            echo "::error::rustc version must be 1.98.1, but found: $VERSION"
            exit 1
          fi

      - name: Clippy
        working-directory: api
        run: cargo clippy -p xc-device-agent --all-targets -- -D warnings

      - name: Install cargo-nextest
        working-directory: api
        run: |
          VERSION="0.9.137"
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-$HOME/.cache}"
          ROOT="$TOOL_CACHE/xchange-cargo-nextest-$VERSION"
          BIN="$ROOT/bin/cargo-nextest"
          if [ ! -x "$BIN" ]; then
            CARGO_TARGET_DIR="$ROOT/target" cargo install cargo-nextest --version "$VERSION" --locked --root "$ROOT"
            rm -rf "$ROOT/target"
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: api
        run: cargo nextest run -p xc-device-agent

  api:
    name: api
    needs: [changes, test, device-agent-linux]
    if: ${{ always() }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: |
          echo "::error::Workflow was cancelled"
          exit 1

      - name: Aggregate status
        run: |
          echo "changes result: ${{ needs.changes.result }}"
          echo "changes skip_build: ${{ needs.changes.outputs.skip_build }}"
          echo "test result: ${{ needs.test.result }}"
          echo "device-agent-linux result: ${{ needs['device-agent-linux'].result }}"

          if [ "${{ needs.changes.result }}" = "cancelled" ] || [ "${{ needs.test.result }}" = "cancelled" ] || [ "${{ needs['device-agent-linux'].result }}" = "cancelled" ]; then
            echo "::error::Dependency was cancelled"
            exit 1
          fi

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.skip_build }}" = "true" ]; then
            echo "Docs-only change: test partitions were skipped; reporting success."
            exit 0
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more test partitions failed: ${{ needs.test.result }}"
            exit 1
          fi

          if [ "${{ needs['device-agent-linux'].result }}" != "success" ]; then
            echo "::error::device-agent-linux failed: ${{ needs['device-agent-linux'].result }}"
            exit 1
          fi

          echo "All test partitions succeeded."
