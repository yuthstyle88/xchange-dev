# Android build of the kiosk: by hand (workflow_dispatch) and on a release branch (#51, option B).
# It does not run on ordinary PRs — only on a PR that changes this file itself.
# Release signing needs ALL FOUR repository secrets (set all four or none; partial fails red):
#   XCHANGE_ANDROID_KEYSTORE_BASE64   the .jks keystore, base64
#   XCHANGE_ANDROID_KEYSTORE_PASSWORD
#   XCHANGE_ANDROID_KEY_ALIAS
#   XCHANGE_ANDROID_KEY_PASSWORD

name: app-android

on:
  workflow_dispatch:
  push:
    branches: ['release/**']
  pull_request:
    paths: ['.github/workflows/app-android.yml']

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('app-android-pr-{0}', github.event.pull_request.number) || format('app-android-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app-android:
    name: app-android
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Refuse to report green when the run was cancelled
        if: cancelled()
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter (use runner SDK)
        run: |
          FLUTTER_ROOT="${FLUTTER_ROOT:-}"
          if [ -z "$FLUTTER_ROOT" ]; then
            for d in "$HOME/develop/flutter" "/Users/yuth/develop/flutter"; do
              if [ -x "$d/bin/flutter" ]; then
                FLUTTER_ROOT="$d"
                break
              fi
            done
          fi
          if [ -z "$FLUTTER_ROOT" ] || [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
            echo "Flutter not found at $FLUTTER_ROOT/bin — set FLUTTER_ROOT on the runner." >&2
            exit 1
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter 3.44.0
        run: |
          flutter --version
          VERSION=$(flutter --version | head -n 1)
          if ! echo "$VERSION" | grep -qE '^Flutter 3\.44\.0(\s|$)'; then
            echo "::error::Flutter version must be 3.44.0, but runner has: $VERSION"
            exit 1
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK 17
        run: |
          java -version
          if ! java -version 2>&1 | grep -q 'version "17'; then
            echo "::error::The Android build needs JDK 17, but the runner answers:" >&2
            java -version 2>&1 >&2
            exit 1
          fi

      - name: Locate the Android SDK
        run: |
          set -eu
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Library/Android/sdk" "/Users/yuth/Library/Android/sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate/platform-tools" ]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "Android SDK: $candidate"
              exit 0
            fi
          done
          echo "::error::No Android SDK found on runner ${RUNNER_NAME} — need a directory containing platform-tools. Searched: ANDROID_HOME=${ANDROID_HOME:-<unset>}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}, $HOME/Library/Android/sdk, /Users/yuth/Library/Android/sdk"
          exit 1

      # Never on a pull_request run (edge case 1): no keystore is decoded, no key.properties
      # written, even when the secrets exist — signing material stays out of PR runs.
      - name: Release signing (all four secrets or none)
        id: signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.XCHANGE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XCHANGE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XCHANGE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XCHANGE_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing XCHANGE_ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing XCHANGE_ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing XCHANGE_ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing XCHANGE_ANDROID_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              # none of the four is set: Gradle falls back to debug signing (edge case 2)
              echo "No signing secrets set — building debug-signed."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Signing secrets are set only in part — missing:$missing. Set all four or none; no silent fallback to debug signing." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/xchange-release.jks"
          # Trailing \n on purpose: OpenSSL 3's `base64 -d` writes 0 bytes with rc 0
          # when the input has no final newline; LibreSSL accepts it either way.
          printf '%s\n' "$KEYSTORE_BASE64" | openssl base64 -d -out "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::XCHANGE_ANDROID_KEYSTORE_BASE64 did not decode to a non-empty keystore." >&2
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > app/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: app
        run: flutter build apk --release

      - name: Build the app bundle (signed builds only)
        if: ${{ steps.signing.outputs.signed == 'true' }}
        working-directory: app
        run: flutter build appbundle --release

      - name: Check the APK package id
        run: |
          set -eu
          build_tools="${ANDROID_HOME:?ANDROID_HOME was not set}/build-tools"
          if [ ! -d "$build_tools" ]; then
            echo "::error::No build-tools under $build_tools — cannot check the APK's package id." >&2
            exit 1
          fi
          latest=$(find "$build_tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          aapt2="$latest/aapt2"
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          package="$("$aapt2" dump packagename "$apk")"
          echo "package id of $(basename "$apk") via $aapt2: $package"
          if [ "$package" != "com.spacing.xchange" ]; then
            echo "::error::The package id must be com.spacing.xchange, but the APK says: $package" >&2
            exit 1
          fi

      - name: Mark the unsigned APK as debug-signed
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: mv app/build/app/outputs/flutter-apk/app-release.apk app/build/app/outputs/flutter-apk/app-release-debug-signed.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: xchange-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload the app bundle (signed builds only)
        if: ${{ steps.signing.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: xchange-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/xchange-release.jks"
          rm -f app/android/key.properties

      - name: Job summary
        if: always()
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          version=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/^version:[[:space:]]*//')
          name="${version%%+*}"
          code="${version##*+}"
          if [ "$SIGNED" = "true" ]; then
            mode="RELEASE-SIGNED"
          else
            mode="DEBUG-SIGNED — not for the Play Console"
          fi
          {
            echo "## Android build"
            echo "- signing: $mode"
            echo "- commit: $GITHUB_SHA"
            echo "- versionName: $name · versionCode: $code (from app/pubspec.yaml)"
          } >> "$GITHUB_STEP_SUMMARY"
