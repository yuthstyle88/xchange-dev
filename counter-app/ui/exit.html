<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>XC Counter</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f6; color: #251e22; font: 16px/1.5 -apple-system, sans-serif; }
  form { display: grid; gap: 12px; width: 320px; }
  input, button { min-height: 44px; padding: 10px 12px; border-radius: 8px; border: 1px solid #e7e2e6; font: inherit; }
  button { background: #a5003c; border-color: #a5003c; color: #fff; font-weight: 600; }
  output { color: #a4371f; min-height: 1.5em; }
</style>
</head>
<body>
<form id="f">
  <label for="pin">PIN ผู้จัดการ</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus required>
  <button type="submit">ออก</button>
  <output id="o"></output>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('o').textContent = '';
    try {
      await window.__TAURI_INTERNALS__.invoke('exit_kiosk', { pin: document.getElementById('pin').value });
    } catch (err) {
      document.getElementById('o').textContent = String(err);
    }
  });
</script>
</body>
</html>
